; rgb-node — 3-channel PWM RGB LED driver for the ESP32-C3 Super Mini.

[platformio]
data_dir = web/dist

[env:esp32c3-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps =
    https://github.com/mathieucarbou/ESPAsyncWebServer.git#v3.6.0
    bblanchon/ArduinoJson @ ^7.3.0
    256dpi/MQTT @ ^2.5.2
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRGBNODE_BRIGHTNESS_POT=0
upload_flags =
    --connect-attempts
    2

[env:esp32c3-supermini-ota]
extends = env:esp32c3-supermini
upload_protocol = espota
upload_port = rgb-node.local

[env:esp32c3-native-idf]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

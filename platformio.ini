; rgb-node — 3-channel PWM RGB LED driver for the ESP32-C3 Super Mini.

[platformio]
data_dir = web/dist

[env:esp32c3-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps =
    https://github.com/mathieucarbou/ESPAsyncWebServer.git#v3.6.0
    bblanchon/ArduinoJson @ ^7.3.0
build_flags =
    ; The Super Mini talks over the C3's native USB (no UART bridge) —
    ; without these, Serial output never reaches the monitor.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRGBNODE_BRIGHTNESS_POT=0

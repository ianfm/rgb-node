; rgb-node — 3-channel PWM RGB LED driver for the ESP32-C3 Super Mini.
;
; Uses the pioarduino platform fork (Arduino core 3.x); the official
; espressif32 platform is frozen at Arduino core 2.x. Pinned to a release
; tag so fresh clones always build against the same toolchain.

[env:esp32c3-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    ; The Super Mini talks over the C3's native USB (no UART bridge) —
    ; without these, Serial output never reaches the monitor.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Uncomment to build without the brightness pot (fixed max brightness):
    ; -DRGBNODE_BRIGHTNESS_POT=0
